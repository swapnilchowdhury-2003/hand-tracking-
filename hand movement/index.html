<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Movement Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        #canvas {
            display: block;
            background: #000;
            border: 3px solid #667eea;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            max-width: 100%;
            height: auto;
        }
        
        #status {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        
        #video {
            display: none;
        }
        
        .info {
            color: #aaa;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖐️ Hand Movement Tracker</h1>
        <video id="video" width="1280" height="720"></video>
        <canvas id="canvas" width="1280" height="720"></canvas>
        <div id="status">Loading AI model...</div>
        <div class="info">Allow camera access to track your hand movements</div>
    </div>

    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        const canvasCtx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        
        // Color palette for 5 finger pairs (5 different vibrant colors)
        const fingerColors = [
            '#FF1744', // Thumb - Red
            '#00E676', // Index - Green
            '#00B0FF', // Middle - Blue
            '#FFD600', // Yellow - Yellow
            '#FF6E40'  // Pinky - Orange
        ];
        
        let hands;
        let camera;
        
        // Initialize Mediapipe Hands
        async function initialize() {
            try {
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });
                
                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                hands.onResults(onResults);
                
                camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({ image: video });
                    },
                    width: 1280,
                    height: 720
                });
                
                camera.start();
                statusDiv.textContent = '✓ Ready - Show your hands to the camera!';
            } catch (error) {
                statusDiv.textContent = '❌ Error: ' + error.message;
                console.error('Initialization error:', error);
            }
        }
        
        function onResults(results) {
            // Clear canvas
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Flip the canvas horizontally for a selfie-view look
            canvasCtx.save();
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvas.width, 0);
            
            // Draw video frame from the video element
            canvasCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvasCtx.restore();
            
            if (results.multiHandLandmarks && results.multiHandedness) {
                // Draw individual hands with circles on landmarks
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    drawHand(landmarks);
                });
                
                // Connect corresponding fingers from both hands with lines
                if (results.multiHandLandmarks.length === 2) {
                    connectFingersBetweenHands(
                        results.multiHandLandmarks[0],
                        results.multiHandLandmarks[1]
                    );
                }
            }
        }
        
        function drawHand(landmarks) {
            // Draw finger joints
            landmarks.forEach((landmark, index) => {
                // Flip X coordinate for selfie view
                const x = (1 - landmark.x) * canvas.width;
                const y = landmark.y * canvas.height;
                
                // Draw circle for each joint
                canvasCtx.fillStyle = '#fff';
                canvasCtx.beginPath();
                canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
            
            // Draw connections between joints (hand skeleton)
            const connections = [
                [0, 1], [1, 2], [2, 3], [3, 4],           // Thumb
                [0, 5], [5, 6], [6, 7], [7, 8],           // Index
                [0, 9], [9, 10], [10, 11], [11, 12],      // Middle
                [0, 13], [13, 14], [14, 15], [15, 16],    // Ring
                [0, 17], [17, 18], [18, 19], [19, 20],    // Pinky
                [5, 9], [9, 13], [13, 17]                 // Palm
            ];
            
            canvasCtx.strokeStyle = '#888';
            canvasCtx.lineWidth = 2;
            
            connections.forEach(([start, end]) => {
                const startLandmark = landmarks[start];
                const endLandmark = landmarks[end];
                
                // Flip X coordinate for selfie view
                const startX = (1 - startLandmark.x) * canvas.width;
                const startY = startLandmark.y * canvas.height;
                const endX = (1 - endLandmark.x) * canvas.width;
                const endY = endLandmark.y * canvas.height;
                
                canvasCtx.beginPath();
                canvasCtx.moveTo(startX, startY);
                canvasCtx.lineTo(endX, endY);
                canvasCtx.stroke();
            });
        }
        
        function connectFingersBetweenHands(hand1Landmarks, hand2Landmarks) {
            // Finger tip indices for each finger
            const fingerTips = [4, 8, 12, 16, 20]; // Thumb, Index, Middle, Ring, Pinky
            
            canvasCtx.lineWidth = 4;
            
            // Connect corresponding fingertips with colorful lines
            fingerTips.forEach((tipIndex, fingerIndex) => {
                const hand1Tip = hand1Landmarks[tipIndex];
                const hand2Tip = hand2Landmarks[tipIndex];
                
                // Flip X coordinate for selfie view
                const hand1X = (1 - hand1Tip.x) * canvas.width;
                const hand1Y = hand1Tip.y * canvas.height;
                const hand2X = (1 - hand2Tip.x) * canvas.width;
                const hand2Y = hand2Tip.y * canvas.height;
                
                // Set color for this finger pair
                canvasCtx.strokeStyle = fingerColors[fingerIndex];
                
                // Draw line connecting the same fingers
                canvasCtx.beginPath();
                canvasCtx.moveTo(hand1X, hand1Y);
                canvasCtx.lineTo(hand2X, hand2Y);
                canvasCtx.stroke();
                
                // Draw glow effect
                canvasCtx.strokeStyle = fingerColors[fingerIndex] + '80'; // Semi-transparent
                canvasCtx.lineWidth = 8;
                canvasCtx.beginPath();
                canvasCtx.moveTo(hand1X, hand1Y);
                canvasCtx.lineTo(hand2X, hand2Y);
                canvasCtx.stroke();
                
                canvasCtx.lineWidth = 4;
            });
        }
        
        // Initialize when page loads
        window.addEventListener('load', initialize);
        
        // Error handling
        window.addEventListener('error', (event) => {
            console.error('Error:', event);
            statusDiv.textContent = '❌ Error: ' + event.message;
        });
    </script>
</body>
</html>
